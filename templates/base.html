<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Product Review Analysis{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            will-change: transform;
            transform: translateZ(0);
            position: relative;
            z-index: 1;
        }
        
        .card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .card:hover::before {
            left: 100%;
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px 0 rgba(0, 0, 0, 0.4);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        
        .nav-link {
            position: relative;
            transition: all 0.3s ease;
            color: #374151;
            font-weight: 500;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s ease;
            border-radius: 2px;
        }
        
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        
        .nav-link:hover {
            color: #2563eb;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
        }
        
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Performance optimizations */
        canvas {
            will-change: auto;
            display: block;
            height: auto !important;
        }
        
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Prevent scroll jumps from canvas resizing */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="glass-effect fixed top-0 left-0 right-0 z-50 mb-4 md:mb-8">
        <div class="container mx-auto px-3 md:px-6 py-3 md:py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-1 md:space-x-2">
                    <i class="fas fa-chart-line text-xl md:text-3xl gradient-text"></i>
                    <h1 class="text-sm md:text-2xl font-bold gradient-text whitespace-nowrap">NLP Analyzer</h1>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex space-x-8">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %} text-gray-700 hover:text-blue-600 font-medium text-base">
                        <i class="fas fa-home mr-2"></i>Home
                    </a>
                    <a href="/reviews" class="nav-link {% if request.path == '/reviews' %}active{% endif %} text-gray-700 hover:text-blue-600 font-medium text-base">
                        <i class="fas fa-comments mr-2"></i>Reviews
                    </a>
                    <a href="/sentiment" class="nav-link {% if request.path == '/sentiment' %}active{% endif %} text-gray-700 hover:text-blue-600 font-medium text-base">
                        <i class="fas fa-heart mr-2"></i>Sentiment
                    </a>
                    <a href="/insights" class="nav-link {% if request.path == '/insights' %}active{% endif %} text-gray-700 hover:text-blue-600 font-medium text-base">
                        <i class="fas fa-lightbulb mr-2"></i>Insights
                    </a>
                </div>
                
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden text-gray-700 hover:text-blue-600 transition-colors">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
            
            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden mt-4 space-y-2">
                <a href="/" class="block py-3 px-4 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition-all {% if request.path == '/' %}bg-blue-50 text-blue-600{% endif %}">
                    <i class="fas fa-home mr-3"></i>Home
                </a>
                <a href="/reviews" class="block py-3 px-4 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition-all {% if request.path == '/reviews' %}bg-blue-50 text-blue-600{% endif %}">
                    <i class="fas fa-comments mr-3"></i>Reviews
                </a>
                <a href="/sentiment" class="block py-3 px-4 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition-all {% if request.path == '/sentiment' %}bg-blue-50 text-blue-600{% endif %}">
                    <i class="fas fa-heart mr-3"></i>Sentiment
                </a>
                <a href="/insights" class="block py-3 px-4 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition-all {% if request.path == '/insights' %}bg-blue-50 text-blue-600{% endif %}">
                    <i class="fas fa-lightbulb mr-3"></i>Insights
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-2 md:px-4 pb-8 md:pb-12 pt-20 md:pt-24">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="glass-effect mt-8 md:mt-12 py-4 md:py-6">
        <div class="container mx-auto px-3 md:px-6 text-center text-gray-600">
            <p class="mb-2 text-xs md:text-base">
                <i class="fas fa-flask mr-1 md:mr-2"></i>
                <span class="hidden sm:inline">NLP Mini Project - </span>BeMinimalist Cleanser Analysis
            </p>
            <p class="text-xs md:text-sm mb-1">Built with Flask, NLP, and ❤️</p>
            <p class="text-xs md:text-sm">
                <i class="fas fa-user-circle mr-1"></i>
                Created by <span class="font-semibold gradient-text">Aniket K. Shinde</span>
            </p>
        </div>
    </footer>
    
    <script>
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        mobileMenuBtn?.addEventListener('click', function() {
            mobileMenu.classList.toggle('hidden');
            const icon = this.querySelector('i');
            if (mobileMenu.classList.contains('hidden')) {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            } else {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            }
        });
        
        // Close mobile menu when clicking outside
        document.addEventListener('click', function(event) {
            if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                const isClickInsideMenu = mobileMenu.contains(event.target);
                const isClickOnButton = mobileMenuBtn.contains(event.target);
                
                if (!isClickInsideMenu && !isClickOnButton) {
                    mobileMenu.classList.add('hidden');
                    const icon = mobileMenuBtn.querySelector('i');
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                }
            }
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
